{% extends 'food_orders/base.html' %}

{% block title %}Login | Easy Eats{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #6b1d2f;">Welcome Back</h2>
    
    <form method="POST" class="auth-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn-pill-primary btn-full" style="margin-top: 1rem;">Login</button>
    </form>
</div>
{% endblock %}
