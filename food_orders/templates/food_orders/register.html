{% extends 'food_orders/base.html' %}

{% block title %}Sign Up | Easy Eats{% endblock %}

{% block content %}
<div class="auth-container">
    <h2 style="text-align: center; margin-bottom: 1.5rem; color: #6b1d2f;">Create Account</h2>
    <form method="POST" class="auth-form">
        {% csrf_token %}
        {% for field in form %}
            <div style="margin-bottom: 1rem;">
                <label style="display: block; font-weight: 600; margin-bottom: 0.3rem;">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <p style="color: red; font-size: 0.85rem; margin-top: 0.2rem;">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn" style="width: 100%; padding: 0.75rem; margin-top: 1rem;">Register</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">
        Already have an account? <a href="{% url 'login' %}" style="color: var(--primary);">Log In</a>
    </p>
</div>
{% endblock %}
